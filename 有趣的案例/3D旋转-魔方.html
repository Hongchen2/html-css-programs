<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3d旋转</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            perspective: 1000px;
            background-color: rgb(218, 215, 215);
        }

        .box {
            margin: 100px auto;
            width: 1050px;
            perspective: 1000px;
        }

        .box>div {
            float: left;
            position: relative;
            width: 200px;
            height: 200px;
            margin-right: 150px;
            margin-bottom: 150px;
            transform-style: preserve-3d;

        }

        .rotateY {
            animation: moveY 1s linear 2s infinite;
        }

        .rotateZ {
            animation: moveZ 1s linear 1s infinite;
        }

        .rotateX {
            animation: moveX 1s linear infinite;
        }

        @keyframes moveX {
            0% {
                transform: rotateX(0deg);
            }

            100% {
                transform: rotateX(360deg);
            }
        }

        @keyframes moveY {
            0% {
                transform: rotateY(0deg);
            }

            100% {
                transform: rotateY(360deg);
            }
        }

        @keyframes moveZ {
            0% {
                transform: rotateZ(0deg);
            }

            100% {
                transform: rotateZ(360deg);
            }
        }

        @keyframes moveXY {
            0% {}

            100% {
                transform: rotate3d(-1, 1, 0, 360deg);
            }
        }

        .x {
            width: 200px;
            height: 100px;
        }

        .y {
            float: left;
            width: 100px;
            height: 200px;
        }

        .z {
            float: left;
            width: 100px;
            height: 100px;
        }

        .red {
            background-color: red;
        }

        .blue {
            background-color: blue;
        }

        .green {
            background-color: yellowgreen;
        }

        .yellow {
            background-color: yellow;
        }

        .pink {
            background-color: pink;
        }

        .orange {
            background-color: orange;
        }

        .aqua {
            background-color: aqua;
        }

        .purple {
            background-color: purple;
        }

        .white {
            background-color: white;
        }

        .style3d div {
            width: 200px;
            height: 200px;
            position: absolute;
            background-color: yellow;
        }

        .style3d {
            animation: moveY 2s linear infinite;
        }

        .style3d div:first-child {
            transform: rotateX(60deg);
            background-color: red;
        }

        .style3d div:last-child {
            transform: rotateX(120deg);
            background-color: blue;
        }

        .style3d div:nth-child(2) {
            transform: rotateY(90deg);
            left: 50px;
            background-color: rgb(21, 243, 21);
        }

        .cube>div {
            position: absolute;
            width: 200px;
            height: 200px;
        }

        .cube>div:nth-child(1) {
            transform: translateZ(100px);
        }

        .cube>div:nth-child(2) {
            transform: translateZ(-100px);
        }

        .cube>div:nth-child(3) {
            transform: translateY(100px) rotateX(90deg);
        }

        .cube>div:nth-child(4) {
            transform: translateY(-100px) rotateX(90deg);
        }

        .cube>div:nth-child(5) {
            transform: translateX(100px) rotateY(90deg);
        }

        .cube>div:nth-child(6) {
            transform: translateX(-100px) rotateY(90deg);
        }

        .cube {
            animation: moveXY 1.5s linear infinite;
        }

        .cube .black div {
            height: 45px;
            width: 45px;
            float: left;
            margin-top: 4px;
            margin-left: 4px;
        }

        .black {
            background-color: black;
        }
    </style>
</head>

<body>
    <div class="box">
        <div class="rotateX">
            <div class="x red"></div>
            <div class="x blue"></div>
        </div>
        <div class="rotateZ">
            <div class="z pink"></div>
            <div class="z orange"></div>
            <div class="z aqua"></div>
            <div class="z purple"></div>
        </div>
        <div class="rotateY">
            <div class="y green"></div>
            <div class="y yellow"></div>
        </div>
        <div class="style3d">
            <div></div>
            <div></div>
            <div></div>
            <div></div>
        </div>
        <div class="cube">
            <div class="black">
                <div class="white"></div>
                <div class="white"></div>
                <div class="white"></div>
                <div class="white"></div>
                <div class="white"></div>
                <div class="white"></div>
                <div class="white"></div>
                <div class="white"></div>
                <div class="white"></div>
                <div class="white"></div>
                <div class="white"></div>
                <div class="white"></div>
                <div class="white"></div>
                <div class="white"></div>

            </div>
            <div class="black">

                <div class="yellow"></div>
                <div class="yellow"></div>
                <div class="yellow"></div>
                <div class="yellow"></div>
                <div class="yellow"></div>
                <div class="yellow"></div>
                <div class="yellow"></div>
                <div class="yellow"></div>
                <div class="yellow"></div>
                <div class="yellow"></div>
                <div class="yellow"></div>
                <div class="yellow"></div>
                <div class="yellow"></div>
                <div class="yellow"></div>
            </div>
            <div class="black">
                <div class="red"></div>
                <div class="red"></div>
                <div class="red"></div>
                <div class="red"></div>
                <div class="red"></div>
                <div class="red"></div>
                <div class="red"></div>
                <div class="red"></div>
                <div class="red"></div>
                <div class="red"></div>
                <div class="red"></div>
                <div class="red"></div>
                <div class="red"></div>
                <div class="red"></div>
                <div class="red"></div>
                <div class="red"></div>
            </div>
            <div class="black">
                <div class="blue"></div>
                <div class="blue"></div>
                <div class="blue"></div>
                <div class="blue"></div>
                <div class="blue"></div>
                <div class="blue"></div>
                <div class="blue"></div>
                <div class="blue"></div>
                <div class="blue"></div>
                <div class="blue"></div>
                <div class="blue"></div>
                <div class="blue"></div>
                <div class="blue"></div>
                <div class="blue"></div>
                <div class="blue"></div>
                <div class="blue"></div>
            </div>
            <div class="black">
                <div class="orange"></div>
                <div class="orange"></div>
                <div class="orange"></div>
                <div class="orange"></div>
                <div class="orange"></div>
                <div class="orange"></div>

                <div class="orange"></div>
                <div class="orange"></div>
            </div>
            <div class="black">
                <div class="green"></div>
                <div class="green"></div>
                <div class="green"></div>
                <div class="green"></div>
                <div class="green"></div>
                <div class="green"></div>
                <div class="green"></div>
                <div class="green"></div>
                <div class="green"></div>

                <div class="green"></div>

                <div class="green"></div>
                <div class="green"></div>
            </div>
        </div>
    </div>

</body>

</html>
